plugins {
    id 'java'
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

group = 'org.ipea'
version = '1.1.0999-SNAPSHOT'

// Build against the version of R5 that the current r5r download_r5 function will
// grab. R code uses single quotes so the arguments survive Windows quoting.
def r5Path = providers.exec {
    commandLine 'R', '--no-save', '-q', '-s', '-e', "setwd('../r-package'); devtools::load_all(quiet=T); cat(download_r5());"
}.standardOutput.asText.get().trim()

def rJavaPath = providers.exec {
    commandLine 'R', '--no-save', '-q', '-s', '-e', "cat(system.file('jri/JRI.jar', package='rJava'))"
}.standardOutput.asText.get().trim()

println(rJavaPath)

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

dependencies {
    implementation files(r5Path)
    // JRI.jar is missing from some rJava builds; Gradle 9 rejects an empty path
    if (rJavaPath) implementation files(rJavaPath)
}