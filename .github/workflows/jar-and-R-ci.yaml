name: CI

on:
  push:
    paths:
      - java-r5rcore/**
      - r-package/**
      - .github/workflows/**

jobs:
  build-jar:
    env:
      GH_TOKEN: ${{ github.token }}

    # pinned: the R packages below are Ubuntu 24.04 (noble) binaries
    runs-on: ubuntu-24.04

    # the job commits the rebuilt JAR back to the branch
    permissions:
      contents: write

    # don't build on merges to master
    if: ${{ !github.ref_protected }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
#        with:
#          use-public-rspm: true # this no longer works as of September 2025

      - name: Install R packages
        run: |
          # this specification is necessary for some reason as of September 2025
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          install.packages(c('devtools', 'remotes'))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        working-directory: r-package

      - name: Install system dependencies
        run: |
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "20.04"))')
        working-directory: r-package

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: java-r5rcore

      - name: Create pull request
        # https://github.com/actions/checkout/pull/1184
        run: |
          NEW_JAR="java-r5rcore/build/libs/java-r5rcore-*.jar"
          TARGET_JAR="r-package/inst/jar/r5r.jar"
        
          new_sha=$(sha256sum $NEW_JAR | awk '{print $1}')
          # ensure file exists and then compute sha
          old_sha=$( [ -f "$TARGET_JAR" ] && sha256sum "$TARGET_JAR" | awk '{print $1}' || echo "" )
          
          echo "NEW: $new_sha"
          echo "OLD: $old_sha"
          
          # Only push if sha different
          if [ "$new_sha" != "$old_sha" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
            echo "JAR changed — updating."
            mv $NEW_JAR $TARGET_JAR
            git add $TARGET_JAR
            git commit -m "Rebuild JAR for commit ${GITHUB_SHA}"
            git push
          else
            echo "JAR unchanged — skipping commit."
          fi

  R-CMD-check:
    needs: build-jar

    runs-on: ${{ matrix.config.os }}

    name: R-CMD-check ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-22.04, r: 'devel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}
          - {os: ubuntu-22.04, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}
          - {os: ubuntu-22.04, r: 'oldrel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}

    env:
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      # Java setup for macOS (using the proper arm64 architecture)
      - name: Java setup (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: arm64

      # Java setup for non-macOS runners
      - name: Java setup (non-macOS)
        if: runner.os != 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r-package

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package

  R-CMD-check-CRAN:
    needs: build-jar

    runs-on: ${{ matrix.config.os }}

    name: R-CMD-check-CRAN

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}

    env:
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r-package

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          NOT_CRAN: false

  test-coverage:
    needs: build-jar

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync to latest HEAD including rebuilt JAR
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git pull origin "${{ github.ref_name }}"

      - uses: r-lib/actions/setup-r@v2

      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          working-directory: r-package

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}
        working-directory: r-package

      - uses: codecov/codecov-action@v7
        with:
          # Fail on upload error only when a token is set (forks have none)
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: r-package